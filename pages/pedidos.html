<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="../js/pedidos.js" defer></script>
  </head>

  <body class="bg-body-tertiary">
    <header class="bg-dark text-white py-4 mb-4">
      <div class="container">
        <p class="text-white-50 mb-1">Ejercicio 2 - Guía 5</p>
        <h1 class="h2 mb-0">Gestión de pedidos de la cafetería</h1>
      </div>
    </header>

    <main class="container pb-5">

      <section class="card shadow-sm mb-4" aria-labelledby="tituloNuevo">
        <div class="card-body">
          <h2 id="tituloNuevo" class="h5 card-title mb-3">Nuevo pedido</h2>

          <form id="formPedido" class="row g-3" novalidate>
            <div class="col-md-6">
              <label for="inputProducto" class="form-label">Producto</label>
              <input
                type="text"
                id="inputProducto"
                class="form-control"
                placeholder="Ej. Café americano"
                autocomplete="off"
                required
              />
              <div class="invalid-feedback" id="errorProducto"></div>
            </div>

            <div class="col-sm-6 col-md-3">
              <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
              <input
                type="number"
                id="inputPrecio"
                class="form-control"
                placeholder="Ej. 2.50"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                required
              />
              <div class="invalid-feedback" id="errorPrecio"></div>
            </div>

            <div class="col-sm-6 col-md-3">
              <label for="inputCantidad" class="form-label">Cantidad</label>
              <input
                type="number"
                id="inputCantidad"
                class="form-control"
                placeholder="Ej. 3"
                min="1"
                step="1"
                inputmode="numeric"
                required
              />
              <div class="invalid-feedback" id="errorCantidad"></div>
            </div>

            <div class="col-12">
              <button type="submit" id="btnAgregar" class="btn btn-primary">
                Agregar pedido
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm" aria-labelledby="tituloTabla">
        <div class="card-body">
          <h2 id="tituloTabla" class="h5 card-title mb-3">Pedidos registrados</h2>

          <div class="row g-2 align-items-start mb-3">
            <div class="col-md-7 col-lg-6">
              <label for="inputPrecioMaximo" class="form-label">Precio máximo ($)</label>
              <div class="input-group has-validation">
                <input
                  type="number"
                  id="inputPrecioMaximo"
                  class="form-control"
                  placeholder="Ej. 3.00"
                  min="0"
                  step="0.01"
                  inputmode="decimal"
                />
                <button type="button" id="btnFiltrar" class="btn btn-outline-primary">
                  Filtrar productos
                </button>
                <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">
                  Mostrar todos
                </button>
                <div class="invalid-feedback" id="errorPrecioMaximo"></div>
              </div>
            </div>
            <div class="col-md-5 col-lg-6 text-md-end align-self-end">
              <button type="button" id="btnLimpiar" class="btn btn-outline-danger">
                Limpiar pedidos
              </button>
            </div>
          </div>

          <div id="avisoFiltro" class="alert alert-info py-2 d-none" role="status"></div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <caption class="visually-hidden">Pedidos registrados en la cafetería</caption>
              <thead class="table-light">
                <tr>
                  <th scope="col">Producto</th>
                  <th scope="col" class="text-end">Precio unitario</th>
                  <th scope="col" class="text-end">Cantidad</th>
                  <th scope="col" class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>

          <div class="row g-3 mt-3">
            <div class="col-sm-6">
              <div class="border rounded p-3 bg-white">
                <p class="text-body-secondary small mb-1">Total de unidades solicitadas</p>
                <p class="h4 mb-0" id="totalUnidades">0</p>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="border rounded p-3 bg-white">
                <p class="text-body-secondary small mb-1">Monto total de los pedidos</p>
                <p class="h4 mb-0" id="montoTotal">$0.00</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <p id="mensajeEstado" class="text-success mt-3 mb-0" aria-live="polite"></p>

      <a href="../index.html" class="btn btn-link px-0 mt-3">Regresar</a>
    </main>
  </body>
</html>
